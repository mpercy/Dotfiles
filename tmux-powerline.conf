# Custom Powerline configuration for tmux
run-shell "/Users/mpercy/Library/Python/3.13/bin/powerline-daemon -q"
set -g status on
# 5s is plenty: lights are pushed by hooks on state changes; this only paces
# the elapsed-time counter, orphan cleanup, and the powerline segments
set -g status-interval 5
set -g status-justify "left"
set -g status-left-length 100
set -g status-right-length 100
# claude-tmux-lights: ONE renderer per tick; publishes each window's @light (prints nothing)
set -g status-left '#(python3 /Users/mpercy/src/claude-tmux-lights/scripts/tmux_render.py --all)#(/Users/mpercy/Library/Python/3.13/bin/powerline tmux left)'
set -g status-right '#(/Users/mpercy/Library/Python/3.13/bin/powerline tmux right)'

# Make the active window stand out more (organic yellow/brown scheme)
setw -g window-status-current-style 'fg=colour230,bg=colour94,bold'
setw -g window-status-current-format ' #I:#W#{@light} '

# Style for inactive windows (light background, dark text)
setw -g window-status-style 'fg=colour238,bg=colour229'
setw -g window-status-format ' #I:#W#{@light} '